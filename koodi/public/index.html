<!doctype html><html lang="fi"><head><meta charset="utf-8"><title>Koppelontien jänis</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:monospace;color:#fff}
body>canvas{width:100vw;height:100vh;image-rendering:pixelated;display:block}
#hud{position:fixed;inset:0;pointer-events:none;text-shadow:1px 1px #000;font-size:15px}
#tl{position:absolute;left:10px;top:10px;line-height:1.5}#tr{position:absolute;right:10px;top:10px;text-align:right}
#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:16px;height:16px;image-rendering:pixelated}
#gun{position:absolute;right:12%;bottom:0;width:38vw;image-rendering:pixelated}
#msg{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);font-size:18px}
#menu{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:stretch;background:#123a;cursor:default;padding:8px 12px 10px;box-sizing:border-box;gap:8px}
#menu h1{margin:0;text-align:center;font-size:26px}
#menu-nappi{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}
#menu-osiot{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(260px,.9fr);gap:10px}
#tauko-ohjeet,#tauko-asetukset{min-height:0;overflow:auto;background:rgba(0,0,0,.35);border:1px solid #ffe9a066;border-radius:8px;padding:8px 10px;text-align:left}
#tauko-ohjeet h2,#tauko-asetukset h2{margin:0 0 6px;font:700 16px monospace;text-align:center}
#tauko-ohjeet table{width:100%;border-collapse:collapse;font:14px/1.35 monospace}
#tauko-ohjeet td{padding:3px 8px;border-bottom:1px solid #ffffff22;vertical-align:top}
#tauko-ohjeet td:first-child{white-space:nowrap;color:#ffe9a0;font-weight:700;text-align:right}
.aset-rivi{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.aset-rivi b{min-width:7.2em}
.aset-rivi button{font:700 14px monospace;padding:6px 8px;border:2px solid #c4a574;background:#1e3550;color:#fff;border-radius:6px;cursor:pointer}
.aset-rivi button.valittu{background:#ffe14a;color:#111;border-color:#111}
.aset-rivi input[type=range]{flex:1;min-width:110px;accent-color:#ffe14a}
#fpsnaytto{position:absolute;left:10px;top:54px;font:700 14px monospace;display:none;background:rgba(0,0,0,.45);padding:2px 6px;border-radius:4px}
#autohje{display:none;position:absolute;left:50%;top:8px;transform:translateX(-50%);max-width:96vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:700 15px monospace;color:#ffe9a0;background:rgba(0,0,0,.5);padding:4px 10px;border-radius:6px}
@media (max-height:640px){#menu{gap:4px;padding:4px 8px 6px}#menu h1{font-size:18px}#jatka{font-size:16px!important;padding:6px 12px!important}#tauko-ohjeet,#tauko-asetukset{padding:4px 8px}#tauko-ohjeet h2,#tauko-asetukset h2{font-size:14px;margin-bottom:2px}#tauko-ohjeet table{font-size:12px;line-height:1.25}#tauko-ohjeet td{padding:1px 6px}.aset-rivi{margin:3px 0}.aset-rivi button{font-size:12px;padding:3px 6px}}
@media (max-width:860px){#menu-osiot{grid-template-columns:1fr}}
#comp{display:block}#wind{width:32px;height:32px;image-rendering:pixelated;vertical-align:middle}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
</head><body>
<div id="hud"><div id="tl"><span id="tls"></span><canvas id="comp" width="128" height="32"></canvas></div><div id="tr">Tuuli <canvas id="wind" width="32" height="32"></canvas><div id="windt"></div><div><img src="/grafiikka/hud/saalis_janis_24.png" onerror="this.remove()" style="vertical-align:middle"> Saalis: <span id="bag">0</span></div></div>
<img id="cross"><img id="gun"><img id="aim" src="/grafiikka/haulikko_tahtays.png" style="display:none;position:absolute;width:50vw;left:25vw;top:calc(50vh - 50vw*58/512);image-rendering:pixelated"><div id="ehint" style="position:absolute;left:50%;top:58%;transform:translateX(-50%);font-size:17px;color:#ffe9a0;text-shadow:0 1px 3px #000;pointer-events:none"></div><div id="puhe" style="display:none;position:absolute;left:50%;bottom:9%;transform:translateX(-50%);max-width:min(680px,92vw);background:rgba(16,14,18,.84);color:#f6efe2;padding:10px 16px 12px;border-radius:14px;font:18px/1.35 Georgia,serif;text-align:center;pointer-events:none;text-shadow:0 1px 1px #000"></div><div id="insinfo" style="display:none;position:absolute;left:50%;top:12%;transform:translateX(-50%);font-size:20px;background:rgba(0,0,0,.55);padding:6px 14px;border-radius:6px;pointer-events:none"></div><div id="msg"></div><div id="vignette" style="position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.75) 100%)"></div><div id="radioname" style="display:none;position:absolute;left:50%;top:18%;transform:translateX(-50%);font-size:22px;color:#ffd"></div><div id="radio" style="display:none;position:absolute;right:12px;bottom:80px;width:256px;height:64px;background:#222c"><img src="/grafiikka/hud/radio_paneeli.png" onload="this.parentNode.style.background='none'" onerror="this.remove()" style="position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated"><div id="radioch" style="position:absolute;left:17.97%;width:63.67%;top:25%;height:50%;display:flex;align-items:center;justify-content:center;color:#9CFF9C;font:bold 12px monospace;-webkit-font-smoothing:none;font-smooth:never;white-space:nowrap;overflow:hidden"></div></div><div id="autohje">R radio · Q kanava · W/S kaasu · A/D ohjaus · E ulos</div><div id="fpsnaytto"></div><div id="cmds" style="position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:flex;gap:6px"></div><div id="gps" style="display:none;position:absolute;left:12px;bottom:12px;width:min(24vw,240px);height:calc(min(24vw,240px)*1.25);background:#222;border-radius:12px"><img id="gpsf" src="/grafiikka/hud/gps_kehys.png" onerror="this.remove()" style="position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated"><canvas id="gpsc" width="256" height="256" style="display:none"></canvas><img id="gpsi" alt="" style="position:absolute;left:17.5%;top:22.5%;width:65%;height:44.5%;image-rendering:pixelated;background:#9ab08a"></div></div>
<div id="menu" style="display:none"><h1>Tauko</h1>
<div id="menu-nappi">
<button id="jatka" type="button" style="font:700 28px monospace;padding:12px 22px;background:#1e6b3a;color:#fff;border:3px solid #ffe9a0;border-radius:8px;cursor:pointer">JATKA JAHTIA</button>
<button id="lopeta" type="button" style="font:700 15px monospace;padding:8px 14px;background:#8a3a18;color:#fff;border:2px solid #c4a574;border-radius:6px;cursor:pointer">Päätä jahti</button>
</div>
<div id="lopeta-varmistus" style="display:none;text-align:center;background:rgba(0,0,0,.55);padding:10px 12px;border-radius:8px"><p style="margin:0 0 8px;font:700 16px monospace">Haluatko varmasti lopettaa jahdin?</p><button id="lopeta-kylla" type="button" style="font:700 16px monospace;padding:8px 16px;margin-right:8px;background:#8a3a18;color:#fff;border:2px solid #ffe9a0;border-radius:6px;cursor:pointer">Kyllä</button><button id="lopeta-ei" type="button" style="font:700 16px monospace;padding:8px 16px;background:#1e3550;color:#fff;border:2px solid #ffe9a0;border-radius:6px;cursor:pointer">Ei</button></div>
<div id="menu-osiot">
<div id="tauko-ohjeet"><h2>Näppäimet</h2></div>
<div id="tauko-asetukset"><h2>Grafiikka</h2>
<div class="aset-rivi" id="aset-laatu"><b>Laatu</b></div>
<div class="aset-rivi" id="aset-res"><b>Resoluutio</b></div>
<div class="aset-rivi" id="aset-naky"><b>Näkyvyys</b></div>
<div class="aset-rivi" id="aset-fps"><b>FPS</b></div>
<h2>Ääni</h2>
<label class="aset-rivi"><b>Yleinen</b><input id="vol-yleinen" type="range" min="0" max="100" value="100"></label>
<label class="aset-rivi"><b>Radio</b><input id="vol-radio" type="range" min="0" max="100" value="100"></label>
<label class="aset-rivi"><b>Puhe</b><input id="vol-puhe" type="range" min="0" max="100" value="100"></label>
</div>
</div></div>
<script type="module" src="/main.js"></script></body></html>
